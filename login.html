<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WOPOS - Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8eaf0;
    }

    .login-container {
      display: flex;
      width: 860px;
      min-height: 520px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    /* ===== LEFT PANEL ===== */
    .left-panel {
      flex: 1;
      background: linear-gradient(145deg, #3a7bd5 0%, #2e5fa3 40%, #4a3fa8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      color: white;
      text-align: center;
    }

    .left-panel .app-title {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: 4px;
      margin-bottom: 14px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .left-panel .app-subtitle {
      font-size: 0.82rem;
      line-height: 1.55;
      opacity: 0.92;
      max-width: 280px;
      margin-bottom: 36px;
    }

    /* ===== ILLUSTRATION SVG ===== */
    .illustration {
      width: 240px;
      height: 200px;
    }

    /* ===== RIGHT PANEL ===== */
    .right-panel {
      flex: 1;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 44px 40px 36px;
    }

    .right-panel .welcome-heading {
      font-size: 2rem;
      font-weight: 700;
      color: #555555;
      margin-bottom: 30px;
    }

    .form-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-group {
      display: flex;
      align-items: center;
      background: #f0f2f5;
      border-radius: 10px;
      padding: 0 14px;
      height: 48px;
      border: 1.5px solid transparent;
      transition: border-color 0.2s;
    }

    .input-group:focus-within {
      border-color: #3a7bd5;
      background: #f5f7ff;
    }

    .input-group .icon {
      font-size: 1.1rem;
      margin-right: 10px;
      flex-shrink: 0;
      color: #6b7280;
      display: flex;
      align-items: center;
    }

    .input-group input,
    .input-group select {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 0.92rem;
      color: #333;
      outline: none;
      height: 100%;
      font-family: inherit;
    }

    .input-group select {
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .select-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      flex: 1;
    }

    .select-wrapper select {
      width: 100%;
      padding-right: 20px;
    }

    .select-arrow {
      position: absolute;
      right: 0;
      pointer-events: none;
      color: #6b7280;
      font-size: 0.75rem;
    }

    .btn-entrar {
      width: 100%;
      height: 48px;
      background: #1a3a6b;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-entrar:hover {
      background: #14305a;
    }

    .btn-entrar:active {
      transform: scale(0.98);
    }

    /* ===== DEVELOPER CARD ===== */
    .dev-card {
      margin-top: 22px;
      width: 100%;
      background: #d8f5ec;
      border-radius: 10px;
      padding: 14px 18px;
      text-align: center;
      border: 1px solid #b2e8d4;
    }

    .dev-card .dev-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #2a7a5c;
      margin-bottom: 4px;
    }

    .dev-card .dev-info {
      font-size: 0.78rem;
      color: #3a7a60;
      line-height: 1.6;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 720px) {
      body {
        align-items: flex-start;
        padding: 0;
      }

      .login-container {
        flex-direction: column;
        width: 100%;
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }

      .left-panel {
        padding: 32px 24px 28px;
      }

      .illustration {
        width: 180px;
        height: 150px;
      }

      .right-panel {
        padding: 36px 28px 32px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">

    <!-- ===== LEFT PANEL ===== -->
    <div class="left-panel">
      <div class="app-title">WOPOS</div>
      <div class="app-subtitle">
        Aplicación para ventas Pos, Plan separe, Remisiones, Cartera,
        Clientes, Proveedores, Compras, Entre otros.
      </div>

      <!-- Illustration: hands holding tablet with invoice/payment -->
      <svg class="illustration" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Tablet body -->
        <rect x="60" y="30" width="120" height="148" rx="12" fill="white" fill-opacity="0.18"/>
        <rect x="66" y="38" width="108" height="118" rx="6" fill="white" fill-opacity="0.25"/>
        <!-- Tablet screen content: invoice lines -->
        <rect x="76" y="50" width="88" height="8" rx="3" fill="white" fill-opacity="0.8"/>
        <rect x="76" y="64" width="60" height="5" rx="2.5" fill="white" fill-opacity="0.55"/>
        <rect x="76" y="74" width="70" height="5" rx="2.5" fill="white" fill-opacity="0.55"/>
        <!-- Divider -->
        <line x1="76" y1="85" x2="164" y2="85" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
        <!-- Line items -->
        <rect x="76" y="91" width="52" height="4" rx="2" fill="white" fill-opacity="0.45"/>
        <rect x="140" y="91" width="24" height="4" rx="2" fill="white" fill-opacity="0.7"/>
        <rect x="76" y="100" width="46" height="4" rx="2" fill="white" fill-opacity="0.45"/>
        <rect x="140" y="100" width="24" height="4" rx="2" fill="white" fill-opacity="0.7"/>
        <rect x="76" y="109" width="56" height="4" rx="2" fill="white" fill-opacity="0.45"/>
        <rect x="140" y="109" width="24" height="4" rx="2" fill="white" fill-opacity="0.7"/>
        <!-- Total row -->
        <line x1="76" y1="119" x2="164" y2="119" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
        <rect x="76" y="124" width="36" height="5" rx="2.5" fill="white" fill-opacity="0.6"/>
        <rect x="132" y="124" width="32" height="5" rx="2.5" fill="white" fill-opacity="0.9"/>
        <!-- Check / paid stamp -->
        <circle cx="120" cy="148" r="10" fill="white" fill-opacity="0.15" stroke="white" stroke-opacity="0.5" stroke-width="1.5"/>
        <polyline points="114,148 118,153 127,143" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.9"/>
        <!-- Home button on tablet -->
        <circle cx="120" cy="170" r="5" fill="white" fill-opacity="0.3" stroke="white" stroke-opacity="0.5" stroke-width="1.2"/>

        <!-- Left hand / arm -->
        <path d="M20 185 Q30 160 55 152 L70 148 L72 158 Q55 162 44 175 Q35 188 30 200 L18 200 Z"
              fill="white" fill-opacity="0.22"/>
        <!-- Right hand / arm -->
        <path d="M220 185 Q210 160 185 152 L170 148 L168 158 Q185 162 196 175 Q205 188 210 200 L222 200 Z"
              fill="white" fill-opacity="0.22"/>

        <!-- Floating mini invoice top-left -->
        <g transform="translate(18, 48) rotate(-15)">
          <rect width="38" height="48" rx="4" fill="white" fill-opacity="0.2" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
          <rect x="5" y="8" width="28" height="3" rx="1.5" fill="white" fill-opacity="0.7"/>
          <rect x="5" y="15" width="20" height="2.5" rx="1.25" fill="white" fill-opacity="0.5"/>
          <rect x="5" y="21" width="22" height="2.5" rx="1.25" fill="white" fill-opacity="0.5"/>
          <rect x="5" y="27" width="18" height="2.5" rx="1.25" fill="white" fill-opacity="0.5"/>
          <rect x="5" y="36" width="28" height="4" rx="2" fill="white" fill-opacity="0.35"/>
        </g>

        <!-- Floating mini invoice top-right -->
        <g transform="translate(192, 40) rotate(12)">
          <rect width="34" height="44" rx="4" fill="white" fill-opacity="0.2" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
          <rect x="4" y="7" width="26" height="3" rx="1.5" fill="white" fill-opacity="0.7"/>
          <rect x="4" y="14" width="18" height="2.5" rx="1.25" fill="white" fill-opacity="0.5"/>
          <rect x="4" y="20" width="20" height="2.5" rx="1.25" fill="white" fill-opacity="0.5"/>
          <rect x="4" y="26" width="16" height="2.5" rx="1.25" fill="white" fill-opacity="0.5"/>
          <rect x="4" y="33" width="26" height="4" rx="2" fill="white" fill-opacity="0.35"/>
        </g>

        <!-- Dollar sign coin top center -->
        <circle cx="120" cy="22" r="9" fill="white" fill-opacity="0.2" stroke="white" stroke-opacity="0.5" stroke-width="1.2"/>
        <text x="120" y="27" text-anchor="middle" font-size="11" fill="white" fill-opacity="0.85" font-weight="bold" font-family="Arial">$</text>
      </svg>
    </div>

    <!-- ===== RIGHT PANEL ===== -->
    <div class="right-panel">
      <h1 class="welcome-heading">¡Bienvenido!</h1>

      <div class="form-wrapper">

        <!-- Username field -->
        <div class="input-group">
          <span class="icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="8" r="4" stroke="#6b7280" stroke-width="1.8" fill="none"/>
              <path d="M4 20c0-4 3.58-7 8-7s8 3 8 7" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            </svg>
          </span>
          <input type="text" placeholder="Usario" autocomplete="username" />
        </div>

        <!-- Company / Branch dropdown -->
        <div class="input-group">
          <span class="icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="10" width="18" height="11" rx="1" stroke="#6b7280" stroke-width="1.8" fill="none"/>
              <path d="M9 21V14h6v7" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" fill="none"/>
              <path d="M1 10l11-7 11 7" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <rect x="9" y="10" width="6" height="4" rx="0.5" stroke="#6b7280" stroke-width="1.4" fill="none"/>
            </svg>
          </span>
          <div class="select-wrapper">
            <select>
              <option value="" disabled selected>Seleccione...</option>
              <option value="1">Sucursal Principal</option>
              <option value="2">Sucursal Norte</option>
              <option value="3">Sucursal Sur</option>
            </select>
            <span class="select-arrow">&#9660;</span>
          </div>
        </div>

        <!-- Password field -->
        <div class="input-group">
          <span class="icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="5" y="11" width="14" height="10" rx="2" stroke="#6b7280" stroke-width="1.8" fill="none"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" fill="none"/>
              <circle cx="12" cy="16" r="1.5" fill="#6b7280"/>
            </svg>
          </span>
          <input type="password" placeholder="Clave" autocomplete="current-password" />
        </div>

        <!-- Submit button -->
        <button class="btn-entrar" type="button">ENTRAR</button>

      </div>

      <!-- Developer credit card -->
      <div class="dev-card">
        <div class="dev-title">Desarrollado por:</div>
        <div class="dev-info">
          Weimar Sanchez G y Diego Castaño.<br />
          Email: weimars70@gmail.com<br />
          Cel: 3017599957
        </div>
      </div>
    </div>

  </div>

</body>
</html>
